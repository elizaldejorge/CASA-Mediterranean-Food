      {n:"Ampeleia — Unlitro (1L) 2022", d:"Tuscany, Italy", p:"1100", note:"N/O/B"},
      {n:"Domaine de la Mongestine — Bob Singlar Red 2024", d:"Provence, France", p:"1150", note:"N/O/B"},
      {n:"Ottin — Torrette Sup\u00e9rieur 2021", d:"Valle d'Aosta, Italy", p:"1250", note:"N"} ]},
    { sub:{en:"Beer",es:"Cerveza"}, items:[ {n:"Dos Equis", p:"80"} ]},
    { sub:{en:"Artisanal Mezcal",es:"Mezcal Artesanal"}, items:[
      {n:"Cupreata · Cuishe · Tobala · Cenizo · Espad\u00edn", d:"glass / bottle", dEs:"copa / botella", p:"200 / 2800"} ]},
    { sub:{en:"Non-Alcoholic",es:"Sin Alcohol"}, items:[
      {n:"Orita Craft Soda", p:"80"}, {n:"Kombucha", p:"120"}, {n:"San Pellegrino", p:"75"}, {n:"Coca-Cola", p:"45"} ]}
  ]}
];

var CUR_LANG="en", CUR_CAT="tapas";
function renderPanel(catId, lang){
  var cat=MENU.find(function(c){return c.id===catId;}); if(!cat) return;
  var dict=I18N[lang];
  var html='<div class="mcat-head"><h3>'+cat.title[lang]+'</h3><span class="ln"></span></div>';
  cat.blocks.forEach(function(block){
    if(block.sub) html+='<div class="subhead">'+block.sub[lang]+'</div>';
    block.items.forEach(function(it){
      if(cat.type==="food"){
        var name=lang==="en"?it[0]:it[1], desc=lang==="en"?it[2]:it[3], price=it[4], tag=it[5];
        var tagHtml=tag==="veg"?'<span class="tag-veg">veg</span>':(tag==="new"?'<span class="tag-new">'+dict.new_label+'</span>':'');
        html+='<div class="dish"><span class="info"><span class="nm">'+name+tagHtml+'</span>'+(desc?'<span class="ds">'+desc+'</span>':'')+'</span><span class="pr">'+price+'</span></div>';
      } else {
        var note=it.note?'<span class="note">'+it.note+'</span>':'';
        var detail=it.d?((lang==="es"&&it.dEs)?it.dEs:it.d):'';
        html+='<div class="dish"><span class="info"><span class="nm">'+it.n+note+'</span>'+(detail?'<span class="ds">'+detail+'</span>':'')+'</span><span class="pr">'+it.p+'</span></div>';
      }
    });
  });
  if(cat.legend) html+='<div class="legend">'+dict.legend+'</div>';
  document.getElementById("menu-panel").innerHTML=html;
}
function buildTabs(){
  var bar=document.getElementById("tabs"); if(!bar) return;
  bar.innerHTML="";
  MENU.forEach(function(cat){
    var b=document.createElement("button"); b.type="button"; b.dataset.cat=cat.id;
    b.addEventListener("click",function(){ CUR_CAT=cat.id; setActiveTab(); renderPanel(CUR_CAT,CUR_LANG); });
    bar.appendChild(b);
  });
}
function setActiveTab(){ document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("active",b.dataset.cat===CUR_CAT); }); }
function labelTabs(lang){ document.querySelectorAll("#tabs button").forEach(function(b){ var cat=MENU.find(function(c){return c.id===b.dataset.cat;}); if(cat) b.textContent=cat.tab[lang]; }); }
function setLang(lang){
  CUR_LANG=lang; var dict=I18N[lang]||I18N.en;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){ var k=el.getAttribute("data-i18n"); if(dict[k]!=null) el.innerHTML=dict[k]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(function(el){ var k=el.getAttribute("data-i18n-aria"); if(dict[k]!=null) el.setAttribute("aria-label",dict[k]); });
  if(document.getElementById("tabs")){ labelTabs(lang); renderPanel(CUR_CAT,lang); }
  var en=document.getElementById("lang-en"), es=document.getElementById("lang-es");
  if(en) en.classList.toggle("active",lang==="en"); if(es) es.classList.toggle("active",lang==="es");
  try{ localStorage.setItem("casa_lang",lang); }catch(e){}
}
function initCommon(){
  if(document.getElementById("tabs")){ buildTabs(); setActiveTab(); }
  var start=null; try{ start=localStorage.getItem("casa_lang"); }catch(e){}
  if(start!=="en"&&start!=="es"){ start=(navigator.language||"").toLowerCase().indexOf("es")===0?"es":"en"; }
  setLang(start);
  var en=document.getElementById("lang-en"), es=document.getElementById("lang-es");
  if(en) en.addEventListener("click",function(){ setLang("en"); });
  if(es) es.addEventListener("click",function(){ setLang("es"); });
  var hdr=document.getElementById("hdr");
  if(hdr) window.addEventListener("scroll",function(){ hdr.classList.toggle("scrolled",window.scrollY>40); },{passive:true});
  var row=document.querySelector('#hours tr[data-d="'+new Date().getDay()+'"]'); if(row) row.classList.add("today");
  var track=document.getElementById("rev-track");
  if(track){
    var step=function(){ var c=track.querySelector(".rev-card"); return c?c.offsetWidth+16:320; };
    var nx=document.getElementById("rev-next"), pv=document.getElementById("rev-prev");
    if(nx) nx.addEventListener("click",function(){ track.scrollBy({left:step(),behavior:"smooth"}); });
    if(pv) pv.addEventListener("click",function(){ track.scrollBy({left:-step(),behavior:"smooth"}); });
  }
  var els=document.querySelectorAll(".reveal");
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }); },{threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  } else { els.forEach(function(el){ el.classList.add("in"); }); }
}
document.addEventListener("DOMContentLoaded", initCommon);

</script>
